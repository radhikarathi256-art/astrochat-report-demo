    var st = d.createElement('style'); st.textContent = CSS; d.head.appendChild(st);
    var a = d.querySelector('#today-a .attach');
    if (a) a.innerHTML = v[2];
    var sc = d.querySelector('#today-a [data-scroll]');
    sc.style.setProperty('scroll-behavior', 'auto', 'important');
    setTimeout(function () {
      var card = d.querySelector('#today-a .attach');
      // Centre the card in the slice of phone the cell actually shows, instead
      // of a fixed offset — the tall variations were falling off the bottom.
      var vh = VP_H / SCALE;
      var want = Math.max(108, (vh - card.offsetHeight) / 2);
      sc.scrollTop += card.getBoundingClientRect().top - want;
      sc.dispatchEvent(new Event('scroll'));
    }, 120);
  });
});
</script>
