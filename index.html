<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroChat · Reports demo</title>
<meta name="description" content="AstroChat: selling a paid report from Today, chat and push, Day 1 to Day 3.">
<meta name="theme-color" content="#FAD2C4" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reports demo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Infant:wght@700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Demo controls. Docked beside the phone on a laptop; inside the hamburger drawer on a phone. -->
<aside class="switcher" id="switcher" aria-label="Demo controls">
  <b class="sw-h">Day</b>
  <div class="sw-days">
    <button type="button" data-day="1">Day 1<small>10 min after the chat · push, chat, Today</small></button>
    <button type="button" data-day="2">Day 2<small>No purchase yet · Personalised Guidance</small></button>
    <button type="button" data-day="3">Day 3<small>Tile, 10 am push, toast and chat</small></button>
  </div>
  <b class="sw-h">Report pitched</b>
  <div class="sw-reps">
    <button type="button" data-rep="m">Marriage Prediction</button>
    <button type="button" data-rep="k">Kundli Milan</button>
    <button type="button" data-rep="w">Monthly Wealth</button>
    <button type="button" data-rep="r">Monthly Relationship</button>
  </div>
  <button type="button" class="sw-restart" data-restart>Restart demo</button>
</aside>

<main class="stage">
  <div class="phone" id="phone">
    <div class="screens" id="screens"></div>
    <div class="overlay" id="overlay"></div>
    <div class="dscrim" id="dscrim" hidden></div>
    <nav class="drawer" id="drawer" aria-label="Demo menu" aria-hidden="true">
      <div class="dr-head"><div><b>Reports demo</b><span>Pick a day and the report to pitch</span></div><button type="button" class="dr-x" id="drClose" aria-label="Close">✕</button></div>
      <div class="dr-body" id="drBody"></div>
    </nav>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
