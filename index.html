<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroChat Reports Demo</title>
<meta name="description" content="AstroChat: selling and reading paid reports. Every Day 1–4 flow, the four reports, buying, after-purchase and page states, straight from Figma.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reports demo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z" fill="#ef6939"/><circle cx="19" cy="18" r="2" fill="#f5b38f"/></svg><span>AstroChat</span><em>Reports demo</em></div>
  <div class="crumb" id="crumb"></div>
  <div class="tools">
    <button type="button" class="tbtn" id="tapToggle" aria-pressed="false">Show tap areas</button>
    <button type="button" class="tbtn" id="restart">Restart flow</button>
  </div>
</header>

<nav class="nav" id="nav" aria-label="Flows"></nav>

<main class="stage" id="stage">
  <div class="phone" id="phone">
    <div class="vp" id="vp" aria-live="polite"></div>
  </div>
</main>

<aside class="panel" id="panel" aria-label="Screen details"></aside>

<button type="button" class="fab" id="fab" aria-label="Open flows and steps"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Flows</span></button>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-sheet" role="dialog" aria-label="Flows and steps">
    <div class="drawer-head"><strong>Reports demo</strong><button type="button" class="tbtn" data-close>Close</button></div>
    <div class="drawer-body">
      <div id="dPanel"></div>
      <div id="dNav"></div>
    </div>
  </div>
</div>

<script src="flows.js"></script>
<script src="app.js"></script>
</body>
</html>
